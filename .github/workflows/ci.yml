name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm exec nx affected -t build typecheck

      - run: pnpm exec vitest run

      - run: pnpm exec nx run-many -t lint

      # Gate on production deps only: dev-only advisories (e.g. nx dev-server
      # tooling) never ship to users and often have no patch available.
      - run: pnpm audit --prod --audit-level high

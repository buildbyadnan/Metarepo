name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          cache-version: 1

      - name: Typecheck and test (Bazel)
        run: bazel test //... --test_output=errors

      - name: Build packages (tsc)
        run: |
          pnpm exec tsc --build packages/http/tsconfig.json
          pnpm exec tsc --build packages/auth/tsconfig.json
          pnpm exec tsc --build packages/api-endpoints/tsconfig.lib.json

      - name: Build web (next)
        run: pnpm --filter @repo/web run build

      - name: Bundle server (wrangler dry-run)
        run: pnpm --filter @repo/server exec wrangler deploy --dry-run --outdir dist

      - name: Lint
        run: pnpm run lint

      # Gate on production deps only: dev-only advisories never ship to
      # users and often have no patch available.
      - run: pnpm audit --prod --audit-level high

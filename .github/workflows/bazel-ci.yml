name: Bazel CI

# Dedicated Bazel check: since stage 3, ci.yml also runs `bazel test //...`
# as part of the main gate; this workflow stays as an independent, separately
# named status check (useful as a branch-protection required check). The Bazel
# build is hermetic — it fetches Node and all npm packages from
# pnpm-lock.yaml itself, so no pnpm install step is needed here.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          cache-version: 1

      # Builds every package and runs all test targets (vitest suites +
      # typecheck tests). Failures print concise test logs via
      # .bazelrc -> test --test_output=errors.
      - run: bazel test //...
